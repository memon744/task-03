<!DOCTYPE html>
<html>
<head>
  <title>Modern Counter App</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      transition: 0.3s;

      background: linear-gradient(135deg, #ff7eb3, #8e44ad);
      color: white;
    }

    body.dark {
      background: linear-gradient(135deg, #1e1e2f, #121212);
      color: #f1f1f1;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 60px;
      margin: 20px 0;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    #increase { background: #2ecc71; color: white; }
    #decrease { background: #e74c3c; color: white; }
    #reset { background: #ecf0f1; color: #333; }
    #toggleMode { background: #333; color: white; }

    button:hover {
      transform: scale(1.1);
      opacity: 0.9;
    }
  </style>

</head>
<body>

  <div class="container">
    <h2>Live Counter</h2>
    <h1 id="count">0</h1>

    <button id="increase">+</button>
    <button id="decrease">-</button>
    <button id="reset">Reset</button>
    <br><br>
    <button id="toggleMode">Toggle Dark Mode</button>
  </div>

  <script>
    let count = 0;

    const countDisplay = document.getElementById("count");
    const increaseBtn = document.getElementById("increase");
    const decreaseBtn = document.getElementById("decrease");
    const resetBtn = document.getElementById("reset");
    const toggleBtn = document.getElementById("toggleMode");

    function updateDisplay() {
      countDisplay.innerText = count;
    }

    increaseBtn.addEventListener("click", () => {
      count++;
      updateDisplay();
    });

    decreaseBtn.addEventListener("click", () => {
      count--;
      updateDisplay();
    });

    resetBtn.addEventListener("click", () => {
      count = 0;
      updateDisplay();
    });

    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });
  </script>

</body>
</html>
